[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
addopts = -m "not perf"
# вывод русских идентификаторов параметризованных тестов без экранирования
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
markers =
    perf: тесты производительности (запуск pytest -m perf)
filterwarnings =
    ignore::DeprecationWarning
