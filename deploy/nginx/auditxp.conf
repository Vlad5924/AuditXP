# /etc/nginx/sites-available/auditxp.conf
# Публикация AuditXP по HTTPS (требование SEC-01, TLS 1.2 и выше)

upstream auditxp_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name auditxp.goldberg-soft.by;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name auditxp.goldberg-soft.by;

    ssl_certificate     /etc/ssl/auditxp/auditxp.crt;
    ssl_certificate_key /etc/ssl/auditxp/auditxp.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /opt/auditxp/frontend/dist;
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://auditxp_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
