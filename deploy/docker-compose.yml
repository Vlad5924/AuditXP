# Развертывание AuditXP в контейнерах
#   cd deploy && docker compose --env-file ../backend/.env up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: auditxp
      POSTGRES_USER: auditxp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-auditxp}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/02_views.sql:/docker-entrypoint-initdb.d/90_views.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditxp -d auditxp"]
      interval: 10s
      retries: 5

  api:
    build: ../backend
    restart: unless-stopped
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://auditxp:${DB_PASSWORD:-auditxp}@db:5432/auditxp
      FRONTEND_DIST: /nonexistent
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
